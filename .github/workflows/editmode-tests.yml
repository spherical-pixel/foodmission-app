name: EditMode tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: editmode-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The Unity image plus the imported Library don't fit in the runner's default free space.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v4

      # Hashing Assets/** times out, so key on packages + editor version and save a fresh cache per commit.
      - name: Restore Library
        id: library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          customParameters: -assemblyNames Foodmission.Tests.Editor
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      # A cold import can leave assets unimported ("infinite import loop"), so keep Library even when tests fail.
      - name: Save Library
        if: always() && steps.library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.library.outputs.cache-primary-key }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: artifacts
          if-no-files-found: ignore
